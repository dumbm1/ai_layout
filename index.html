<!doctype html>
<html>
<head>
 <meta charset="utf-8">

 <link rel="stylesheet" href="css/topcoat-desktop-dark.min.css"/>
 <link id="hostStyle" rel="stylesheet" href="css/styles.css"/>
 <link id="layoutStyle" rel="stylesheet" href="css/layout.css"/>
 <link rel="stylesheet" href="assets/css/main.css"/>

 <title>layout</title>
</head>

<body class="hostElt">

<div id="content">

 <section class="section">
  <input type="file" id="chooseFileBtn" accept=".xlsx" class="input-file">
 </section>

 <!--FILE NAME-->
 <section class="section">
  <div class="w100" id="fileNameRow" style="overflow: hidden">
   <label for="fileName">Имя файла:</label>
   <textarea class="hostTextarea" id="fileName"></textarea>
  </div>
 </section>
 <section class="section">
  <div class="w100" id="layoutNameRow">
   <label for="layoutName">Имя файла в опорке:</label>
   <textarea class="hostTextarea" id="layoutName"></textarea>
  </div>
 </section>

 <div class="sep-horiz"></div>

 <!--LAYOUT-->
 <section class="section">
  <div><label for="filmWidth">W монтажа</label>
   <input id="filmWidth" class="hostTextarea" type="number" disabled></div>

  <div><label for="streams">Ручьев * </label>
   <input id="streams" class="hostTextarea" type="number" min="1"></div>

  <div><label for="layoutWidth">W ручья</label>
   <input id="layoutWidth" class="hostTextarea" type="number" step="0.5" min="10"></div>

  <div><label for="z">Вал</label>
   <select class="hostTextarea" name="z" id="z">
    <!--<option selected value="">360</option>-->
   </select></div>
 </section>

 <section class="section">
  <div><label for="margLeft">Отступ лев</label>
   <input id="margLeft" class="hostTextarea" type="number" step="0.5"></div>
  <div><label for="margRight">Отступ пр</label>
   <input id="margRight" class="hostTextarea" type="number" step="0.5"></div>
  <div><label for="margTop">Отступ верх</label>
   <input id="margTop" class="hostTextarea" type="number" step="0.5"></div>
  <div><label for="margBott">Отступ ниж</label>
   <input id="margBott" class="hostTextarea" type="number" step="0.5"></div>
 </section>

 <!--CROSS, RAILS, INDENTS-->
 <section class="section">
  <div><label for="crossWidth">Крест W, H</label>
   <input id="crossWidth" class="hostTextarea" type="number" step="0.5" min="1"></div>
  <div><label for="crossStroke">Крест толщ</label>
   <input id="crossStroke" class="hostTextarea" type="number" step="0.05" min="0.05"></div>
  <div><label for="indentIn">Отступ опор</label>
   <input id="indentIn" class="hostTextarea" type="number" step="0.5" min="0"></div>
  <div><label for="railWidth">W опорки</label>
   <input id="railWidth" class="hostTextarea" type="number" step="0.5" min="2"></div>
 </section>

 <div class="sep-horiz"></div>

 <!--COLORS BLOCK-->
 <section class="block">

  <!--SEARCH PANTONES-->
  <div class="row p-rel">
   <textarea id="pantSearch" class="hostTextarea" placeholder="Найти цвет по имени"
             name="pantSearch"></textarea>
   <!--<input id="setColorsFromXmlBtn" class="hostButton p-abs" type="button" value="xml">-->
  </div>
  <!--PANTNE LIST-->
  <div class="row" id="pantList">
   <div class="hostTextarea">
    <!--the list of pantones generated by javascript-->
    <!--
    <ul id="pantListUl">
        <li class="" style="background-color: rgb(255, 253, 0);"><span style="color: black;"> Yellow 012</span></li>
        <li class="hidden" style="background-color: rgb(255, 120, 0);"><span style="color: black;"> Orange 021</span></li>
        ....</ul>
        -->
   </div>
  </div>
  <!--OUT COLORS-->
  <p class="title-label">Краски:</p>
  <div class="row col-btns">
   <div id="colBtns">
    <!--COLOR BUTTON TMPLATE-->
    <!--
    <div class="col-btn" style="background-color: rgb(0, 255, 255); color: rgb(0, 0, 0);">
        <span class="col-btn-title">C</span>
        <span class="hostButton col-btn-close-btn">×</span>
    </div>
    -->
   </div>
  </div>
 </section>

 <div class="sep-horiz"></div>

 <!--WHITE LAYER-->
 <section class="section section__div-flx-row">
  <div>
   <input id="white_layer" type="checkbox">
   <label for="white_layer">Слой для белил</label>
  </div>
  <div>
   <input id="dots" type="checkbox">
   <label for="dots">Микроточки</label>
  </div>

 </section>

 <section class="section section__div-flx-row">

  <div>
   <input id="active_doc" type="checkbox" checked>
   <label for="active_doc">Создать в этом документе</label>
  </div>
  <div>
   <input id="rail_lines" type="checkbox" checked>
   <label for="rail_lines">Линии в опорках</label>
  </div>
 </section>

 <div class="sep-horiz"></div>

 <fieldset class="section">
  <legend class="">Количество градаций шкалок на каждую краску:</legend>
  <input type="number" class="shift hostTextarea" id="shift_1" min="1" max="5" step="1" value="5">
  <input type="number" class="shift hostTextarea" id="shift_2" min="1" max="5" step="1" value="5">
  <input type="number" class="shift hostTextarea" id="shift_3" min="1" max="5" step="1" value="5">
  <input type="number" class="shift hostTextarea" id="shift_4" min="1" max="5" step="1" value="5">
  <input type="number" class="shift hostTextarea" id="shift_5" min="1" max="5" step="1" value="1">
  <input type="number" class="shift hostTextarea" id="shift_6" min="1" max="5" step="1" value="1">
  <input type="number" class="shift hostTextarea" id="shift_7" min="1" max="5" step="1" value="1">
  <input type="number" class="shift hostTextarea" id="shift_8" min="1" max="5" step="1" value="1">
 </fieldset>

 <div class="sep-horiz"></div>

 <!--MAIN BUTTONS-->
 <section class="section">
  <button class="btn btn__main-btn" id="btnOk">Погнали!</button>
  <svg class="btn btn__icon" id="btnReset">
   <use href="assets/img/icons-sprite.svg#refresh"></use>
  </svg>
  <svg class="btn btn__icon" id="btn_github" title="Open source on https://github.com/dumbm1/ai_layout">
   <use href="assets/img/icons-sprite.svg#github"></use>
  </svg>
 </section>

</div>

<script src="js/libs/CSInterface.js"></script>
<script src="js/libs/jquery-2.0.2.min.js"></script>

<script src="js/themeManager.js"></script>
<script src="js/main.js"></script>

<script src="js/libs/xlsx.js"></script>
<script src="js/setFromXlsxFf.js"></script>

<script src="assets/js/themeChanger.js"></script>
</body>
</html>
